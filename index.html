<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokédex — Kanto #001–151</title>
  <!-- Bump ?v= when styles or scripts change so GitHub Pages' CDN and
       phone browsers can't serve a stale copy. -->
  <link rel="stylesheet" href="styles.css?v=2" />
</head>
<body>
  <div class="page">
    <header class="top">
      <h1>Pokédex <span class="subtitle">Kanto · #001–151</span></h1>
      <div class="controls">
        <input id="search" type="search" placeholder="Search by name or #..." aria-label="Search Pokémon" />
        <select id="type-filter" aria-label="Filter by type">
          <option value="">All types</option>
        </select>
      </div>
    </header>

    <main>
      <div class="device">
        <!-- Left half -->
        <div class="half left">
          <div class="lid-top">
            <div class="lens"><span class="lens-glint"></span></div>
            <div class="leds">
              <span class="led red"></span>
              <span class="led amber"></span>
              <span class="led green"></span>
            </div>
          </div>

          <div class="screen-frame">
            <div class="frame-lights" aria-hidden="true">
              <span></span><span></span>
            </div>

            <div class="color-screen">
              <div class="screen-title" id="mon-name">BULBASAUR</div>
              <img class="mon-sprite" id="mon-image" src="" alt="" />
              <div class="screen-caption" id="mon-genus">Seed Pokémon</div>
            </div>

            <div class="frame-bottom" aria-hidden="true">
              <span class="frame-led" id="lamp"></span>
              <div class="frame-grille">
                <span></span><span></span><span></span><span></span>
              </div>
            </div>
          </div>

          <div class="under-screen">
            <button type="button" class="shutter-btn" id="btn-play" aria-label="Play Pokédex entry"></button>
            <div class="dashes" aria-hidden="true">
              <span></span><span></span>
            </div>
          </div>

          <div class="lower-left">
            <div class="mini-lcd" id="mini-lcd"></div>

            <div class="dpad" role="group" aria-label="Navigate Pokémon">
              <span class="dpad-plate" aria-hidden="true"></span>
              <button type="button" class="dpad-arm up" data-dir="up"></button>
              <button type="button" class="dpad-arm left" data-dir="left"></button>
              <button type="button" class="dpad-arm right" data-dir="right"></button>
              <button type="button" class="dpad-arm down" data-dir="down"></button>
            </div>
          </div>
        </div>

        <div class="hinge" aria-hidden="true">
          <span class="barrel-cap top"></span>
          <span class="barrel-cap bottom"></span>
        </div>

        <!-- Right half -->
        <div class="half right">
          <div class="info-screen" id="info-screen"></div>

          <div class="keypad" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
          </div>

          <div class="button-bank">
            <button type="button" class="wide-key" id="btn-mode">List</button>
            <span class="wide-key static" aria-hidden="true"></span>
            <div class="bank-dashes" aria-hidden="true">
              <span></span><span></span>
            </div>
          </div>

          <div class="bottom-bank">
            <div class="dark-bar" id="type-plate"></div>
            <div class="dark-bar" id="dex-plate"></div>
            <button type="button" class="yellow-btn" id="btn-random" aria-label="Random Pokémon"></button>
          </div>
        </div>
      </div>

      <p class="hint" id="hint"></p>
      <p id="result-count" class="result-count"></p>
    </main>

    <footer class="site-footer">
      <p>
        Stats, species data, and sprites sourced from the
        <a href="https://github.com/PokeAPI/pokeapi" target="_blank" rel="noopener">PokéAPI</a>
        project (Pokémon and Pokémon character names are trademarks of Nintendo).
      </p>
    </footer>
  </div>

  <script src="app.js?v=2"></script>
</body>
</html>
