<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokédex — Kanto #001–151</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header class="top">
      <h1>Pokédex <span class="subtitle">Kanto · #001–151</span></h1>
      <div class="controls">
        <input id="search" type="search" placeholder="Search by name or #..." aria-label="Search Pokémon" />
        <select id="type-filter" aria-label="Filter by type">
          <option value="">All types</option>
        </select>
      </div>
    </header>

    <main>
      <div class="device">
        <div class="topbar">
          <div class="lens"></div>
          <div class="leds">
            <span class="led green"></span>
            <span class="led amber"></span>
          </div>
          <span class="topbar-label">POKÉDEX</span>
        </div>

        <div class="screens">
          <div class="panel left">
            <div class="color-screen">
              <img class="mon-sprite" id="mon-image" src="" alt="" />
            </div>
            <div class="nameplate">
              <div class="dex-no" id="mon-dexno">No.001</div>
              <div class="mon-name" id="mon-name">BULBASAUR</div>
            </div>
            <div class="type-row" id="mon-types"></div>
            <div class="spacer"></div>
            <div class="left-controls">
              <button type="button" class="shutter-btn" id="btn-play" aria-label="Play Pokédex entry"></button>
              <div class="grille">
                <span></span><span></span><span></span><span></span><span></span>
              </div>
            </div>
          </div>

          <div class="hinge"></div>

          <div class="panel right">
            <div class="info-screen" id="info-screen"></div>
            <div class="controls-row">
              <div class="dpad">
                <span class="bar h"></span><span class="bar v"></span>
              </div>
              <div class="spacer"></div>
              <div class="round-btn-group">
                <button type="button" class="round-btn white" id="btn-prev" aria-label="Previous Pokémon">‹</button>
                <button type="button" class="round-btn amber" id="btn-next" aria-label="Next Pokémon">›</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <p id="result-count" class="result-count"></p>

      <div class="filmstrip" id="filmstrip" role="list" aria-label="Choose a Pokémon"></div>
    </main>

    <footer class="site-footer">
      <p>
        Stats, species data, and sprites sourced from the
        <a href="https://github.com/PokeAPI/pokeapi" target="_blank" rel="noopener">PokéAPI</a>
        project (Pokémon and Pokémon character names are trademarks of Nintendo).
      </p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
